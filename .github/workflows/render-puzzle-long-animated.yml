name: Puzzle Render — Long Format (Animated Reveal, Gold Theme)

# MANUAL ONLY. Unlike render_puzzle_long.yml (which polls automatically),
# this workflow only ever runs when you trigger it by hand with a specific
# quiz_id. That is deliberate: puzzle_render_long_animated.js renders
# exactly one row per run and never touches the pending_long queue that
# the original scheduled workflow depends on, so the two can never race
# or double-render the same puzzle.
on:
  workflow_dispatch:
    inputs:
      quiz_id:
        description: 'puzzle.id (uuid) of the detective puzzle to render'
        required: true
        type: string

concurrency:
  group: render-puzzle-long-animated
  cancel-in-progress: false

jobs:
  render-puzzle-long-animated:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install FFmpeg, Python and Chromium runtime deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3 python3-pip \
            libasound2t64 libatk-bridge2.0-0 libatk1.0-0 libcups2 \
            libdbus-1-3 libdrm2 libgbm1 libgtk-3-0 libnspr4 libnss3 \
            libx11-xcb1 libxcomposite1 libxdamage1 libxfixes3 \
            libxkbcommon0 libxrandr2 xdg-utils
          pip3 install --break-system-packages edge-tts

      - name: Test edge-tts
        run: |
          edge-tts --voice en-US-JennyNeural --text "Brain challenge loading." --write-media /tmp/test.mp3
          ls -la /tmp/test.mp3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Render animated long puzzle video
        env:
          SUPABASE_URL:         ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          R2_ACCESS_KEY:        ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY:        ${{ secrets.R2_SECRET_KEY }}
          R2_ENDPOINT:          ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET:            ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_URL:        ${{ secrets.R2_PUBLIC_URL }}
          QUIZ_ID:              ${{ github.event.inputs.quiz_id }}
        run: node puzzle_render_long_animated.js

      - name: Upload animated puzzle video artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: puzzle-long-animated-${{ github.run_id }}
          path: /tmp/*_puzzle_video_animated.mp4
          retention-days: 3
          if-no-files-found: ignore

      # NOTE: downstream publishers (YouTube/Blog/Facebook) are intentionally
      # NOT triggered here. This variant writes its URL to
      # `medium_video_url` (see ANIMATED_OUTPUT_URL_COLUMN in the .js file),
      # not `video_url`, so the existing publish pipeline won't pick it up
      # even if it were triggered. Wire in a dispatch step here once you're
      # happy with the output and have a real publish path for it.
