name: Puzzle Render — Micro Format (~10s)

# ─────────────────────────────────────────────────────────────────────────
# Runs puzzle_render_micro.js — a COMPLETELY NEW, standalone renderer.
#
# It does NOT touch short_status / medium_status / long_status /
# assigned_format, and does NOT race with render_puzzle_short.yml,
# render_puzzle_medium.yml, render_puzzle_long*.yml, or the nointro variant.
# It reads/writes only the puzzle table's own `micro_status` /
# `micro_video_url` columns (see the migration SQL documented at the top of
# puzzle_render_micro.js — run it once before enabling this workflow).
#
# Trigger this however you like:
#   • Manual "Run workflow" button (workflow_dispatch), OR
#   • On a schedule, OR
#   • repository_dispatch type `trigger-puzzle-render-micro` (fire this from
#     puzzle_generator.js or anywhere else once you want it wired in — not
#     wired in by default so it never fires unexpectedly).
# ─────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch: {}

  repository_dispatch:
    types: [trigger-puzzle-render-micro]

  # Optional schedule — every 15 minutes. Remove this block if you'd rather
  # drive it purely via workflow_dispatch / repository_dispatch.
  schedule:
    - cron: '*/15 * * * *'

# Queue — never cancel in progress, so no puzzle rows are missed
concurrency:
  group: render-puzzle-micro
  cancel-in-progress: false

jobs:
  render-puzzle-micro:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── GATE ────────────────────────────────────────────────────────────
      # Eligible rows: micro_status is NULL (never touched) or 'pending_micro'.
      # Exits in ~2s if nothing is eligible — cheap enough to run on a
      # schedule without wasting minutes.
      - name: Gate — check for pending micro puzzle rows
        id: gate
        env:
          SUPABASE_URL:         ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          ROWS=$(curl -sf \
            -H "apikey: $SUPABASE_SERVICE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            "$SUPABASE_URL/rest/v1/puzzle?or=(micro_status.is.null,micro_status.eq.pending_micro)&is_active=eq.true&puzzle_enriched=eq.true&select=id&limit=1" \
          | jq 'length' 2>/dev/null || echo "0")
          echo "pending=$ROWS" >> $GITHUB_OUTPUT
          if [ "$ROWS" = "0" ]; then
            echo "[GATE] No pending micro puzzle rows — skipping render."
          else
            echo "[GATE] Found $ROWS pending micro puzzle row(s) — proceeding."
          fi

      - name: Install FFmpeg, Python and Chromium runtime deps
        if: steps.gate.outputs.pending != '0'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3 python3-pip \
            libasound2t64 libatk-bridge2.0-0 libatk1.0-0 libcups2 \
            libdbus-1-3 libdrm2 libgbm1 libgtk-3-0 libnspr4 libnss3 \
            libx11-xcb1 libxcomposite1 libxdamage1 libxfixes3 \
            libxkbcommon0 libxrandr2 xdg-utils
          pip3 install --break-system-packages edge-tts

      - name: Test edge-tts
        if: steps.gate.outputs.pending != '0'
        run: |
          edge-tts --voice en-US-JennyNeural --text "Can you solve it." --write-media /tmp/test.mp3
          ls -la /tmp/test.mp3

      - name: Setup Node.js
        if: steps.gate.outputs.pending != '0'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        if: steps.gate.outputs.pending != '0'
        run: npm install

      - name: Render micro puzzle video (~10s)
        if: steps.gate.outputs.pending != '0'
        env:
          SUPABASE_URL:         ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          R2_ACCESS_KEY:        ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY:        ${{ secrets.R2_SECRET_KEY }}
          R2_ENDPOINT:          ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET:            ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_URL:        ${{ secrets.R2_PUBLIC_URL }}
        run: node puzzle_render_micro.js

      - name: Upload micro puzzle video artifact
        if: steps.gate.outputs.pending != '0'
        uses: actions/upload-artifact@v4
        with:
          name: puzzle-micro-${{ github.run_id }}
          path: /tmp/*_puzzle_micro_video.mp4
          retention-days: 3
